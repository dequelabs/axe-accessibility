name: Create release PR

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: SemVer release type (automatic picks one from the commits since the last release)
        type: choice
        default: automatic
        options:
          - automatic
          - major
          - minor
          - patch

permissions:
  contents: read

jobs:
  create-release-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/deps
      - name: Bump the version and update the changelog
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          if [ "$RELEASE_TYPE" = automatic ]; then
            RELEASE_TYPE=$(node scripts/release-type.mjs)
          fi
          pnpm run release --release-as "$RELEASE_TYPE"
          pnpm exec prettier --write CHANGELOG.md .claude-plugin
          pnpm run check:versions
      - name: Commit the release
        run: |
          VERSION=$(node -p 'require("./.claude-plugin/plugin.json").version')
          BRANCH="release-${VERSION}"
          TITLE="chore(release): v${VERSION}"

          git config user.name attest-team-ci
          git config user.email aciattestteamci@deque.com
          git switch -c "$BRANCH"
          git commit -am "$TITLE"

          {
            echo "VERSION=${VERSION}"
            echo "BRANCH=${BRANCH}"
            echo "TITLE=${TITLE}"
          } >> "$GITHUB_ENV"
      # Pushes and PRs made with the default GITHUB_TOKEN don't trigger
      # workflows, so CI would never run on the release PR.
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          INCLUDED=$(node scripts/release-issues.mjs)
          CHANGES=$(node scripts/changelog-section.mjs "$VERSION")

          BODY=$(cat <<EOM
          Release v${VERSION}.

          Merging this PR tags \`v${VERSION}\` and publishes a GitHub release with the changelog entry below as its notes. Self-hosted marketplace users get it on their next plugin update.

          ## Included in this release

          ${INCLUDED}

          ## Changelog

          ${CHANGES:-_No notable changes._}
          EOM
          )
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
