name: Live server check

# Checks that the skills still match the Axe MCP Server the plugin pins, run
# against Deque's dev environment. Not a PR check: it depends on a live backend.
#
# Requires the AXE_API_KEY_DEV secret, an API key from a shared MCP team account,
# used only by this check. The account must be entitled to Advanced Rules and
# every guided test (the server hides parameters the account can't use). The
# AXE_SERVER_URL repository variable overrides the environment. Scheduled
# failures alert Slack through the SLACK_BOT_TOKEN secret; without it, they
# go unnoticed.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify AXE_API_KEY_DEV is configured
        env:
          AXE_API_KEY: ${{ secrets.AXE_API_KEY_DEV }}
        run: |
          if [ -z "$AXE_API_KEY" ]; then
            echo "::error::AXE_API_KEY_DEV must be set in repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install the Chromium the pinned server supports
        run: |
          server=$(sed -n 's/.*axe-mcp-server@\([0-9.]*\).*/\1/p' scripts/start-axe-mcp-server.sh)
          playwright=$(npm view "axe-mcp-server@$server" dependencies.playwright)
          if [ -z "$server" ] || [ -z "$playwright" ]; then
            echo "::error::Could not read the pinned axe-mcp-server version or its Playwright dependency."
            exit 1
          fi
          npx -y "playwright@$playwright" install --with-deps chromium
      - run: node scripts/check-live-server.mjs
        env:
          AXE_API_KEY: ${{ secrets.AXE_API_KEY_DEV }}
          AXE_SERVER_URL: ${{ vars.AXE_SERVER_URL || 'https://axe.dequelabs.com' }}

  notify:
    needs: live-server
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same message as axe-mcp-server's failure alerts. Their shared action lives
    # in an internal repo, which a public repo's workflows can't use.
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            # #axe-mcp-server-alerts
            channel: C0B693DMA0L
            text: "Workflow failed: ${{ github.workflow }} in ${{ github.repository }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: ":x: Workflow Failed: ${{ github.workflow }}"
                  emoji: true
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Repository*: ${{ github.repository }}"
                  - type: mrkdwn
                    text: "*Branch*: `${{ github.ref_name }}`"
                  - type: mrkdwn
                    text: "*Commit*: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  - type: mrkdwn
                    text: "*Triggered by*: ${{ github.actor }}"
              - type: actions
                elements:
                  - type: button
                    text:
                      type: plain_text
                      text: View Workflow Run
                    url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
